[platformio]
src_dir = Core/Src
include_dir = Core/Inc
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<*> -<vision_tracking_test.cpp>

monitor_speed = 115200

lib_deps =
    coryjfowler/mcp_can@1.5.1

[env:vision_tracking_test]
extends = env:uno
build_src_filter =
    +<auto.cpp>
    +<motor.cpp>
    +<can_comm.cpp>
    +<vision_tracking_test.cpp>
